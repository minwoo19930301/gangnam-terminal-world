<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고속터미널 멀티버스</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc4e8;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
#hud{position:fixed;left:12px;top:12px;color:#fff;background:#0008;padding:8px 12px;border-radius:8px;font-size:14px;max-width:320px}
#where{font-size:18px;font-weight:700}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;color:#fff;text-align:center;cursor:pointer}
#start div{max-width:520px;padding:20px;line-height:1.6}
#map{position:fixed;right:12px;top:12px;border-radius:8px;background:#0008}
#tp{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
#tp button{border:0;border-radius:6px;padding:6px 10px;background:#fffd;font-size:13px;cursor:pointer}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff8}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div id="where">신반포로</div><div>WASD 이동 · 마우스 시점 · Shift 달리기 · 문(빛나는 입구)에 다가가면 실내로</div></div>
<canvas id="map" width="180" height="220"></canvas>
<div id="cross"></div>
<div id="tp"></div>
<div id="start"><div><h2>고속터미널 멀티버스</h2>고투몰 · 신세계백화점 강남점 · JW메리어트 · 꽃시장 · 경부선/호남선 · 다이소 · 노브랜드 · 파미에스테이션 · 반포한강공원<br><br>클릭해서 시작</div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9cc4e8);
scene.fog=new THREE.Fog(0x9cc4e8,150,900);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,2000);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xffffff,0x667755,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(200,400,150);scene.add(sun);

// ---------- helpers ----------
const solids=[]; // {x0,x1,z0,z1,y0,y1}
const zones=[];  // {name,x0,x1,z0,z1,y0,y1}
const doors=[];  // {x,z,y,to:[x,y,z,yaw],label}
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(x,y,z,w,h,d,c,solid=true,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat||M(c));
  m.position.set(x,y+h/2,z);scene.add(m);
  if(solid)solids.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y0:y,y1:y+h});
  return m;
}
function texText(lines,bg,fg,w=512,h=128){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  const L=[].concat(lines);const fs=Math.min(h/L.length*0.7,w/ (Math.max(...L.map(s=>s.length))*0.9));
  g.font=`bold ${fs}px "Apple SD Gothic Neo",sans-serif`;
  L.forEach((s,i)=>g.fillText(s,w/2,h*(i+0.5)/L.length));
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function sign(text,x,y,z,w,h,rotY=0,bg='#222',fg='#fff'){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:texText(text,bg,fg,512,Math.round(512*h/w)),side:THREE.DoubleSide}));
  m.position.set(x,y,z);m.rotation.y=rotY;scene.add(m);return m;
}
function windowsMat(base,rows=8,cols=6,lit='#bcd8f0'){
  const c=document.createElement('canvas');c.width=128;c.height=128;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,128);g.fillStyle=lit;
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)g.fillRect(k*128/cols+3,r*128/rows+3,128/cols-6,128/rows-7);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}
function building(x,z,w,d,h,base,{floorH=4,lit}={}){
  const t=windowsMat(base,8,6,lit);t.repeat.set(Math.max(1,w/24),Math.max(1,h/(floorH*8)));
  const t2=t.clone();t2.repeat.set(Math.max(1,d/24),Math.max(1,h/(floorH*8)));t2.needsUpdate=true;
  const side=new THREE.MeshLambertMaterial({map:t}),side2=new THREE.MeshLambertMaterial({map:t2}),top=M(0x777777);
  return box(x,0,z,w,h,d,0,true,[side2,side2,top,top,side,side]);
}
function zone(name,x0,x1,z0,z1,y0=-99,y1=999){zones.push({name,x0,x1,z0,z1,y0,y1})}
function road(x,z,w,d,lanes=0,dirX=true){
  box(x,-0.05,z,w,0.05,d,0x3a3a3c,false);
  if(lanes){for(let i=1;i<lanes;i++){const off=(i/lanes-0.5)*(dirX?d:w);
    for(let s=-(dirX?w:d)/2;s<(dirX?w:d)/2;s+=12){
      const c=(i===lanes/2)?0xf2c200:0xffffff;
      if(dirX)box(x+s,0,z+off,6,0.02,0.25,c,false);else box(x+off,0,z+s,0.25,0.02,6,c,false);}}}
}
function crosswalk(x,z,len,alongX){for(let i=-len/2;i<len/2;i+=1.6){alongX?box(x+i,0.01,z,0.8,0.02,6,0xffffff,false):box(x,0.01,z+i,6,0.02,0.8,0xffffff,false)}}
function tree(x,z,s=1){box(x,0,z,0.5*s,3*s,0.5*s,0x6b4a2b,false);const m=new THREE.Mesh(new THREE.SphereGeometry(2.2*s,8,6),M(0x3f8a3c));m.position.set(x,4*s,z);scene.add(m)}
function bus(x,z,rot=0,c=0x2b7bd0){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2.5,3.2,12),M(c));b.position.y=1.9;g.add(b);
  const w=new THREE.Mesh(new THREE.BoxGeometry(2.55,1,11),M(0x203040));w.position.y=2.6;g.add(w);g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  solids.push({x0:x-3,x1:x+3,z0:z-3,z1:z+3,y0:0,y1:3.5});}
function car(x,z,rot){const cs=[0xffffff,0x222222,0xaa2222,0x8899aa,0x334488];const c=cs[(Math.abs(x*7+z*3)|0)%5];
  const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,1,4.4),M(c));b.position.y=0.7;g.add(b);
  const t=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.7,2.2),M(0x223344));t.position.y=1.5;g.add(t);g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);return g}
function door(x,z,y,to,label,rotY=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(4,3.2),new THREE.MeshBasicMaterial({color:0xffe9a0,transparent:true,opacity:0.75,side:THREE.DoubleSide}));
  m.position.set(x,y+1.6,z);m.rotation.y=rotY;scene.add(m);doors.push({x,z,y,to,label});
  if(label)sign(label,x,y+3.8,z,5,0.9,rotY,'#113','#fff');
}
function interior(cx,cz,w,d,h,floor,wall,name){ // room at y=-100 layer
  const Y=-100;box(cx,Y-0.2,cz,w,0.2,d,floor);
  box(cx,Y,cz-d/2,w,h,0.4,wall);box(cx,Y,cz+d/2,w,h,0.4,wall);
  box(cx-w/2,Y,cz,0.4,h,d,wall);box(cx+w/2,Y,cz,0.4,h,d,wall);
  box(cx,Y+h,cz,w,0.3,d,0xf4f4f0,false);
  const l=new THREE.PointLight(0xffffff,800,Math.max(w,d)*1.2);l.position.set(cx,Y+h-1,cz);scene.add(l);
  zone(name,cx-w/2,cx+w/2,cz-d/2,cz+d/2,Y-5,Y+h);
  return Y;
}

// ---------- 좌표계: x=동(+), z=남(+), 1단위=1m. 기준점 = 고속터미널역 (신반포로 위) ----------
// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),M(0x8a8f86));ground.rotation.x=-Math.PI/2;scene.add(ground);

// 도로망 (네이버 지도 배치 기준 단순화)
road(0,0,1400,30,6,true);          sign(['신반포로'],0,0.05,0,1,1); // label dummy hidden below
road(-330,-300,34,900,6,false);    // 반포대로 (서측, 남북)
road(330,-250,28,800,6,false);     // 사평대로/신반포로 동측 축 (단순화)
road(0,-620,1400,40,8,true);       // 올림픽대로
road(-80,330,1200,26,6,true);      // 남측 도로 (사평대로 방향)
crosswalk(-330,0,30,true);crosswalk(330,0,28,true);crosswalk(0,0,30,false);crosswalk(-200,0,30,false);
for(let x=-650;x<650;x+=18){tree(x,-18,0.9);tree(x+9,18,0.9)}
for(let z=-560;z<300;z+=18){tree(-350,z,0.9);tree(-310,z+9,0.9)}
sign(['신반포로'],-120,6,-17,10,1.6,0,'#1a5a2a','#fff');
sign(['반포대로 ↑ 반포한강공원'],-312,6,-30,14,1.6,Math.PI/2,'#1a5a2a','#fff');
sign(['올림픽대로'],0,6,-598,12,1.6,0,'#1a5a2a','#fff');
// 지하철 3·7·9호선 출입구
for(const [x,z,n] of [[-40,-17,'1'],[40,17,'5'],[-150,-17,'7'],[120,-17,'3'],[-260,17,'9']]){
  box(x,0,z,3,2.6,5,0x5a6a7a,false);sign([`고속터미널역 ${n}번 출구`],x,3.4,z+2.6,3.6,0.7,0,'#e46f1d','#fff');
}
// 차량
const cars=[];for(let i=0;i<40;i++){const lane=(i%6)-2.5;const c=car(-650+i*33,lane*4.5,lane<0?Math.PI/2:-Math.PI/2);c.userData={v:(lane<0?1:-1)*(8+i%5)};cars.push(c)}

// ===== 1. 경부·영동선 (센트럴 동측 블록: 경부선 터미널 건물) + 신세계백화점 강남점 + JW메리어트 =====
const G={x:180,z:-130};
building(150,-90,180,90,32,'#d8d2c4',{lit:'#8aa0b4'});   // 신세계 강남점 (저층 백화점 매스)
sign(['SHINSEGAE'],150,24,-44.8,60,8,0,'#e8e2d4','#222');
sign(['신세계백화점 강남점'],150,15,-44.8,40,4,0,'#e8e2d4','#a01020');
zone('신세계백화점 강남점',60,240,-135,-45);
building(240,-210,60,60,140,'#5f7180',{lit:'#c9d6e0'});    // JW메리어트 (고층 타워)
sign(['JW MARRIOTT'],240,128,-179.8,40,6,0,'#2a3540','#e8d9a8');
zone('JW 메리어트 호텔 서울',210,270,-240,-180);
building(110,-215,110,80,26,'#c6c0b0');                   // 경부선 터미널동
sign(['서울고속버스터미널 경부·영동선'],110,22,-174.8,60,5,0,'#0d3b7a','#fff');
zone('경부·영동선 터미널',55,165,-255,-175);
// 3층 꽃시장 - 터미널동 위로 올라가는 외부 계단(램프)
const ramp=new THREE.Mesh(new THREE.BoxGeometry(6,0.4,40),M(0x9a9a9a));ramp.position.set(48,6.5,-215);ramp.rotation.x=-Math.atan2(13,40);scene.add(ramp);
sign(['꽃시장 3F ↗'],48,4,-193,6,1.2,0,'#c2185b','#fff');
// 경부선 주차장 / 승차장 (터미널 남동 노천)
box(110,0.01,-300,160,0.02,70,0x55585c,false);zone('경부선 승차장·주차장',30,190,-335,-265);
for(let i=0;i<10;i++){bus(45+i*15,-300,0,i%2?0x2b7bd0:0x1f9d55);box(45+i*15,0,-322,1,3,1,0xaaaaaa,false);sign([`${i+1}`],45+i*15,3.5,-321.4,1.4,1.4,0,'#0d3b7a','#fff')}

// ===== 2. 센트럴시티 (호남선 + 파미에스테이션) =====
building(-160,-110,200,110,30,'#cfc8bb',{lit:'#9fb3c3'});
sign(['CENTRAL CITY'],-160,26,-54.8,50,6,0,'#cfc8bb','#333');
sign(['호남선 고속버스터미널'],-200,18,-54.8,36,4,0,'#0d3b7a','#fff');
zone('센트럴시티',-260,-60,-165,-55);
building(-160,-220,180,60,45,'#7d6f5e');  // 메리어트 이코노미/센트럴 북측 매스
// 호남선 주차장
box(-160,0.01,-300,180,0.02,60,0x55585c,false);zone('호남선 승차장·주차장',-250,-70,-330,-270);
for(let i=0;i<9;i++)bus(-235+i*18,-300,0,0x7a3fb0);
for(let i=0;i<14;i++)car(-240+i*12,-275,0);

// ===== 3. 남측 상가 (다이소·노브랜드 지상점 표현) =====
building(-150,90,90,50,18,'#bfb7a6');sign(['DAISO 다이소'],-170,8,64.8,24,4,0,'#d71920','#fff');
zone('다이소 (지상 매장)',-195,-105,65,115);
building(-40,90,70,50,14,'#bfb7a6');sign(['no brand 노브랜드'],-40,8,64.8,24,4,0,'#ffd400','#000');
zone('노브랜드',-75,-5,65,115);
building(80,100,120,60,40,'#a9b2b8');building(260,95,90,60,60,'#b8b0a2');
building(-450,-120,120,200,50,'#c0b8a8');building(-450,150,120,200,35,'#aaa499');building(480,-80,120,160,55,'#b4b0a8');

// ===== 4. 반포한강공원 =====
box(0,-0.02,-760,1400,0.02,240,0x5f9a4a,false);zone('반포한강공원',-700,700,-880,-640);
const river=new THREE.Mesh(new THREE.PlaneGeometry(3000,500),new THREE.MeshLambertMaterial({color:0x3e6f99}));river.rotation.x=-Math.PI/2;river.position.set(0,-0.5,-1130);scene.add(river);
// 반포대교 + 잠수교
box(-330,9,-1130,30,2,500,0x9a9a92,false);box(-330,0,-1130,14,0.6,500,0xb0b0a8,false);
for(let z=-1370;z<-890;z+=40){box(-342,0,z,2,9,2,0x888880,false);box(-318,0,z,2,9,2,0x888880,false)}
sign(['반포대교 달빛무지개분수'],-330,12,-882,20,2.5,0,'#1a1a3a','#9ef');
// 세빛섬
for(const [x,c] of [[-150,0xd8e8f4],[-105,0xf0e6c0],[-70,0xe8d0e8]]){const s=new THREE.Mesh(new THREE.SphereGeometry(14,16,10,0,Math.PI*2,0,Math.PI/2),M(c));s.position.set(x,0,-905);s.scale.y=0.7;scene.add(s)}
sign(['세빛섬'],-110,14,-885,12,2,0,'#334','#fff');
for(let x=-650;x<650;x+=25)tree(x,-700+((x*13)%30),1.1);
// 나들목 (올림픽대로 하부 통로)
box(-260,0,-640,10,4,0.5,0x777777,false);sign(['반포 나들목'],-260,4.6,-639,8,1.2,0,'#1a5a2a','#fff');
// 고속터미널 북측 ~ 올림픽대로 사이 아파트 (반포 래미안/자이 느낌)
for(let i=0;i<6;i++){building(-150+i*80,-450,40,25,60+(i%3)*15,'#e9e4da');}
zone('반포동 아파트 단지',-200,300,-520,-380);

// ===== 실내 (y=-100 레이어) =====
// 고투몰 지하상가: 신반포로 아래 길게 이어진 통로
const gotoY=interior(0,1500,600,14,4,0x8c7b6a,0xe8e2d6,'고투몰 (강남터미널 지하도상가)');
for(let x=-290;x<290;x+=10){const c=['#e9a','#9ce','#fd8','#bdf','#cfa','#fbc'][(x/10+30)%6|0];
  box(x,gotoY,1500-5.5,9,3,3,0xf6f2ea,false);sign([['옷','신발','악세서리','이불','꽃','카페','휴대폰','가방'][(x/10+30)%8|0]],x,gotoY+3.2,1500-3.9,6,0.8,0,c,'#222');
  box(x,gotoY,1500+5.5,9,3,3,0xf6f2ea,false);sign([['원피스','니트','양말','그릇','쥬얼리','분식','안경','모자'][(x/10+31)%8|0]],x,gotoY+3.2,1500+3.9,6,0.8,Math.PI,c,'#222');}
sign(['GOTO MALL 고투몰 · 동편 ←→ 서편'],0,gotoY+3.6,1500-6.7,30,1.2,0,'#222','#fff');
door(-295,1500,gotoY,[-40,0,-22,0],'출구 → 신반포로(서)',Math.PI/2);
door(295,1500,gotoY,[40,0,22,Math.PI],'출구 → 신반포로(동)',Math.PI/2);
door(-150,1500-6.5,gotoY,[-170,-100,1690,Math.PI],'파미에스테이션 연결 →');
door(150,1500-6.5,gotoY,[0,-100,1860,0],'신세계 강남점 지하 연결 →');
door(-60,1500+6.5,gotoY,[-60,-100,1993,Math.PI],'다이소(지하) →');
door(60,1500+6.5,gotoY,[100,-100,1993,Math.PI],'노브랜드(지하) →');
// 파미에스테이션 (센트럴시티 지하 푸드홀)
const fY=interior(-170,1660,120,50,5,0xb79a7a,0xf2ece0,'파미에스테이션 (센트럴시티 지하)');
for(let i=0;i<8;i++){box(-220+i*14,fY,1640,10,2.5,6,0xffffff,false);sign([['베이커리','라멘','디저트','샐러드','커피','버거','타르트','김밥'][i]],-220+i*14,fY+3,1643.1,8,1,0,'#2d2d2d','#f5d78a')}
for(let i=0;i<6;i++)box(-200+i*12,fY,1675,4,0.9,4,0x9b6b43,false);
sign(['FAMILLE STATION'],-170,fY+4,1635.3,30,1.5,0,'#2d2d2d','#f5d78a');
door(-170,1684,fY,[-160,0,-50,Math.PI],'센트럴시티(호남선) 지상으로');
door(-225,1660,fY,[0,-100,1500,Math.PI/2],'고투몰로',Math.PI/2);
// 신세계 강남점 1F + 꽃시장 3F
const sY=interior(0,1820,140,80,6,0xeeeae2,0xf8f6f0,'신세계백화점 강남점 1F');
for(let i=0;i<10;i++){box(-55+i*12,sY,1800,6,1.2,6,0xd8c8a8,false);sign([['CHANEL','DIOR','LV','HERMES','GUCCI','PRADA','CARTIER','TIFFANY','BVLGARI','CELINE'][i]],-55+i*12,sY+4,1797,8,1,0,'#111','#eee')}
door(0,1858,sY,[150,0,-40,Math.PI],'신세계 정문 (신반포로)');
door(-68,1820,sY,[0,-100,1500,0],'지하 고투몰로',Math.PI/2);
door(68,1820,sY,[110,-100,2190,Math.PI],'경부선 3F 꽃시장 ↑',Math.PI/2);
const kY=interior(110,2150,120,70,4,0x6d6d62,0xd6d2c4,'고속터미널 꽃시장 (경부선 3F)');
for(let r=0;r<4;r++)for(let i=0;i<9;i++){box(60+i*12,kY,2120+r*16,8,1,4,0x5b4a33,false);
  for(let k=0;k<6;k++){const f=new THREE.Mesh(new THREE.SphereGeometry(0.35,6,4),M([0xff4d6d,0xffd166,0xf8f8ff,0xc77dff,0xff8fab][(i+k+r)%5]));f.position.set(56+i*12+k*1.5,kY+1.3,2120+r*16+(k%2-0.5));scene.add(f)}}
sign(['꽃시장 · 생화 / 조화 / 인테리어'],110,kY+3.4,2115.3,30,1.2,0,'#c2185b','#fff');
door(110,2184,kY,[48,0,-190,Math.PI],'경부선 터미널 밖으로');
// 다이소·노브랜드 지하 매장
const dY=interior(-60,2010,60,30,4,0xdddddd,0xffffff,'다이소 (고투몰 연결)');
for(let i=0;i<5;i++)box(-80+i*10,dY,2005,2,2.2,16,0xd71920,false);sign(['DAISO'],-60,dY+3.3,1995.3,16,1.2,0,'#d71920','#fff');
door(-60,1997,dY,[0,-100,1500,Math.PI/2],'고투몰로');

door(-160,-53,0,[-170,-100,1678,0],'파미에스테이션 ↓');

// ---------- 미니맵 ----------
const mc=document.getElementById('map').getContext('2d');
function drawMap(){
  mc.clearRect(0,0,180,220);const S=0.13,ox=90,oz=150;const P=(x,z)=>[ox+x*S,oz+z*S];
  mc.fillStyle='#5f9a4a';mc.fillRect(...P(-700,-880),1400*S,240*S);
  mc.fillStyle='#3e6f99';mc.fillRect(...P(-700,-1130),1400*S,250*S);
  mc.fillStyle='#555';[[0,0,1400,30],[-330,-300,34,900],[330,-250,28,800],[0,-620,1400,40],[-80,330,1200,26]].forEach(([x,z,w,d])=>mc.fillRect(...P(x-w/2,z-d/2),w*S,d*S));
  mc.fillStyle='#cbb';for(const z of zones)if(z.y0<0&&z.y0>-50||z.y0===-99)mc.fillRect(...P(z.x0,z.z0),(z.x1-z.x0)*S,(z.z1-z.z0)*S);
  const p=cam.position;if(p.y>-50){const [mx,mz]=P(p.x,p.z);mc.fillStyle='#f33';mc.beginPath();mc.arc(mx,mz,4,0,7);mc.fill();
    mc.strokeStyle='#f33';mc.beginPath();mc.moveTo(mx,mz);mc.lineTo(mx-Math.sin(yaw)*12,mz-Math.cos(yaw)*12);mc.stroke();}
  else{mc.fillStyle='#fff';mc.font='12px sans-serif';mc.fillText('실내/지하',60,210)}
}

// ---------- 텔레포트 버튼 ----------
const spots=[['고속터미널역',0,0,-8,0],['고투몰',0,-100,1500,Math.PI/2],['신세계',150,0,-30,0],['JW메리어트',240,0,-160,0],['꽃시장',110,-100,2170,0],['경부선 주차장',110,0,-260,0],['호남선 주차장',-160,0,-260,0],['파미에',-170,-100,1675,0],['다이소',-150,0,50,0],['노브랜드',-40,0,50,0],['반포한강공원',-200,0,-760,0]];
const tp=document.getElementById('tp');for(const [n,x,y,z,r] of spots){const b=document.createElement('button');b.textContent=n;b.onclick=e=>{e.stopPropagation();go([x,y,z,r])};tp.append(b)}

// ---------- 1인칭 컨트롤 ----------
let yaw=0,pitch=0,vy=0;const EYE=1.65;const keys={};
cam.position.set(0,EYE,-8);
function go([x,y,z,r]){cam.position.set(x,y+EYE,z);yaw=r;vy=0;cool=1}
const st=document.getElementById('start');
st.onclick=()=>{ren.domElement.requestPointerLock();st.style.display='none'};
ren.domElement.onclick=()=>ren.domElement.requestPointerLock();
document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*0.0025;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*0.0025))}});
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
// 터치: 왼쪽 드래그 이동, 오른쪽 드래그 시점
let tch={};
addEventListener('touchstart',e=>{st.style.display='none';for(const t of e.changedTouches)tch[t.identifier]={x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,left:t.clientX<innerWidth/2}},{passive:true});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){const o=tch[t.identifier];if(!o)continue;if(!o.left){yaw-=(t.clientX-o.x)*0.005;pitch=Math.max(-1.4,Math.min(1.4,pitch-(t.clientY-o.y)*0.005))}o.x=t.clientX;o.y=t.clientY}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches)delete tch[t.identifier]});
function blocked(x,z,feet){for(const s of solids){if(x>s.x0-0.3&&x<s.x1+0.3&&z>s.z0-0.3&&z<s.z1+0.3&&feet<s.y1-0.3&&feet+1.7>s.y0)return true}return false}
function groundAt(x,z,feet){
  let g=feet<-50?-100:0;
  // 꽃시장 램프: x 45~51, z -195 ~ -235, 0→13
  if(x>45&&x<51&&z<-195&&z>-235&&feet>-50)g=Math.max(g,(-195-z)/40*13);
  return g;
}
let cool=0;const where=document.getElementById('where');const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  for(const o of Object.values(tch))if(o.left){f-=(o.y-o.sy)/60;s+=(o.x-o.sx)/60}
  f=Math.max(-1,Math.min(1,f));s=Math.max(-1,Math.min(1,s));
  const sp=(keys.ShiftLeft||keys.ShiftRight?18:6)*dt;
  const p=cam.position;let feet=p.y-EYE;
  const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
  if(!blocked(p.x+dx,p.z,feet))p.x+=dx;if(!blocked(p.x,p.z+dz,feet))p.z+=dz;
  const g=groundAt(p.x,p.z,feet);
  if(keys.Space&&feet<=g+0.01)vy=5;vy-=15*dt;feet+=vy*dt;if(feet<g){feet=g;vy=0}p.y=feet+EYE;
  cam.rotation.set(pitch,yaw,0,'YXZ');
  cool=Math.max(0,cool-dt);
  if(!cool)for(const d of doors)if(Math.abs(feet-d.y)<3&&Math.hypot(p.x-d.x,p.z-d.z)<2.2){go(d.to);break}
  for(const c of cars){c.position.x+=c.userData.v*dt;if(c.position.x>700)c.position.x=-700;if(c.position.x<-700)c.position.x=700}
  let name='도로 · 보행로';
  if(Math.abs(p.z)<15&&feet>-50)name='신반포로 (고속터미널역 앞)';
  else if(Math.abs(p.x+330)<17&&feet>-50)name='반포대로';
  else if(Math.abs(p.z+620)<20&&feet>-50)name='올림픽대로 / 반포 나들목';
  for(const z of zones)if(p.x>z.x0&&p.x<z.x1&&p.z>z.z0&&p.z<z.z1&&feet>=z.y0&&feet<=z.y1){name=z.name;break}
  where.textContent=name;drawMap();
  ren.render(scene,cam);requestAnimationFrame(loop);
}
loop();
</script>
